name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. Without this, pushing twice in
# a minute leaves two runs competing for the same runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and query a real database
    runs-on: ubuntu-latest

    services:
      # A real Postgres, not a mock. The point of this job is to prove the
      # migrations apply to an empty database and the API can then answer from it —
      # which is exactly what a deploy does.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bistro
          POSTGRES_PASSWORD: bistro
          POSTGRES_DB: bistro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bistro -d bistro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bistro:bistro@localhost:5432/bistro?schema=public
      DIRECT_URL: postgresql://bistro:bistro@localhost:5432/bistro?schema=public
      SEED_ADMIN_EMAIL: ci@bistro.local
      # Throwaway, and only ever used against this job's disposable database. The
      # seed refuses anything shorter than twelve characters.
      SEED_ADMIN_PASSWORD: ci-only-password
      SEED_ADMIN_NAME: CI Owner
      JWT_SECRET: ci-only-secret-long-enough-to-satisfy-validation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` rather than install: it fails if package.json and the lockfile
      # disagree, which is a mistake worth failing on rather than silently fixing.
      #
      # This step is also what catches a Windows-only lockfile. One was committed
      # here before, and it installed fine on the author's machine while breaking
      # every Linux build, including the Docker image and the deploy.
      - run: npm ci

      - name: Build the shared package
        run: npm run build --workspace @bistro/shared

      - name: Generate the Prisma client
        run: npm run db:generate --workspace @bistro/api

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Apply migrations to an empty database
        run: npm run db:deploy --workspace @bistro/api

      - name: Seed, then seed again
        # Run twice on purpose. The seed is built from upserts and is supposed to be
        # idempotent; running it once only proves it works on an empty database.
        run: |
          npm run db:seed --workspace @bistro/api
          npm run db:seed --workspace @bistro/api

      - name: Build the API
        run: npm run build --workspace @bistro/api

      - name: Serve the API and query it
        run: |
          npm run start --workspace @bistro/api &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health >/dev/null; then break; fi
            sleep 1
          done
          echo "liveness:"
          curl -sf http://localhost:4000/health
          echo
          echo "readiness (does a database round trip):"
          curl -sf http://localhost:4000/health/ready
          echo
          echo "the menu, from Postgres:"
          curl -sf http://localhost:4000/api/menu \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);if(m.dishes.length!==12)throw new Error('expected 12 dishes, got '+m.dishes.length);console.log(m.dishes.length+' dishes, '+m.categories.length+' categories');});"
        env:
          PORT: 4000
          NODE_ENV: production

      - name: Build the web app
        # No API is running by this point, and that is deliberate: fetchMenu returns
        # null rather than throwing, so the build must succeed against a cold
        # backend. If this step ever starts needing a live API, that guarantee broke.
        run: npm run build --workspace @bistro/web

  docker:
    name: Build the images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built, not pushed. This exists because the Dockerfiles have gone wrong in
      # ways nothing else catches: a missing OpenSSL, a rewrite destination baked in
      # at build time, a secret copied into a layer. A green typecheck says nothing
      # about any of them.
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          push: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
            API_INTERNAL_URL=http://api:4000
          cache-from: type=gha
          cache-to: type=gha,mode=max
